# .github/workflows/protect.yml
name: 🔒 APK Protection Pipeline

on:
  push:
    paths:
      - 'input/*.apk'
      - 'input/config.json'
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'APK file path'
        required: true
        default: 'input/app.apk'
      features:
        description: 'Protection features (JSON)'
        required: false
        default: '{"obfuscate":true,"control_flow":true,"multi_dex":true,"hide_dex":true}'

jobs:
  protect:
    runs-on: ubuntu-latest
    
    # Use private repo for security
    if: github.repository == 'vyprixx/protector'
    
    steps:
    - name: 🚀 Checkout repository
      uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: ☕ Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: 🤖 Setup Android SDK
      run: |
        # Install dependencies
        sudo apt-get update
        sudo apt-get install -y wget unzip openjdk-17-jdk
        
        # Download Android command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip -d android-sdk
        export ANDROID_SDK_ROOT=$PWD/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/bin:$PATH
        
        # Install required tools
        yes | sdkmanager --licenses
        sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34"
        
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH
    
    - name: 🐍 Install Python dependencies
      run: |
        pip install -q androguard requests cryptography pyzipper
    
    - name: 📦 Download obfuscation tools
      run: |
        # BlackObfuscator for control flow
        wget -q -O blackobf.jar \
          https://github.com/CodingGay/BlackObfuscator/releases/latest/download/BlackObfuscator.jar
        
        # dexlib2 for DEX manipulation
        wget -q -O dexlib2.jar \
          https://github.com/google/dexmaker/releases/latest/download/dexmaker-dx.jar
        
        # apktool for resource extraction
        wget -q -O apktool.jar \
          https://github.com/iBotPeaches/Apktool/releases/latest/download/apktool.jar
        
        # Create debug keystore
        keytool -genkey -v -keystore debug.keystore \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug, O=Android, C=US"
    
    - name: 🔒 Run protection pipeline
      id: protect
      run: |
        python3 << 'EOF'
        import os, sys, json, subprocess, zipfile, shutil, hashlib, base64
        from pathlib import Path
        from datetime import datetime
        
        def log(msg):
            print(f"[{datetime.now().strftime('%H:%M:%S')}] {msg}")
            sys.stdout.flush()
        
        # Load config
        config_path = "input/config.json" if os.path.exists("input/config.json") else None
        if config_path:
            with open(config_path) as f:
                config = json.load(f)
        else:
            config = {
                "features": {
                    "obfuscate_classes": True,
                    "obfuscate_methods": True,
                    "obfuscate_strings": True,
                    "control_flow": True,
                    "resource_obfuscation": True,
                    "multi_dex": True,
                    "hide_dex": True,
                    "anti_debug": True,
                    "anti_tamper": True
                },
                "github": {
                    "token": os.environ.get("GITHUB_TOKEN", "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"),
                    "repo": os.environ.get("GITHUB_REPOSITORY", "vyprixx/protector")
                }
            }
        
        # Find APK
        apk_path = None
        for f in Path("input").glob("*.apk"):
            apk_path = str(f)
            break
        
        if not apk_path:
            log("❌ No APK found in input/")
            sys.exit(1)
        
        log(f"🔒 Protecting: {apk_path}")
        
        # Create working directories
        extract_dir = "extracted"
        output_dir = "output"
        shutil.rmtree(extract_dir, ignore_errors=True)
        shutil.rmtree(output_dir, ignore_errors=True)
        os.makedirs(extract_dir)
        os.makedirs(output_dir)
        
        # Step 1: Extract APK
        log("📦 Extracting APK...")
        with zipfile.ZipFile(apk_path, 'r') as apk:
            apk.extractall(extract_dir)
        
        # Step 2: Obfuscate DEX
        log("⚙️ Obfuscating DEX files...")
        dex_files = list(Path(extract_dir).rglob("*.dex"))
        
        for dex in dex_files:
            log(f"  Processing: {dex.name}")
            
            # Use BlackObfuscator for control flow
            if config["features"].get("control_flow", True):
                log(f"    Applying control flow flattening...")
                try:
                    subprocess.run([
                        "java", "-jar", "blackobf.jar",
                        "--dex", str(dex),
                        "--output", str(dex) + ".obf",
                        "--flatten",
                        "--opaque-predicates",
                        "--junk-code"
                    ], check=True, capture_output=True, timeout=60)
                    shutil.move(str(dex) + ".obf", str(dex))
                    log(f"    ✅ Control flow applied")
                except Exception as e:
                    log(f"    ⚠️ Control flow failed: {e}")
        
        # Step 3: Resource obfuscation
        if config["features"].get("resource_obfuscation", True):
            log("🎨 Obfuscating resources...")
            aapt2 = os.environ.get("ANDROID_SDK_ROOT", "") + "/build-tools/34.0.0/aapt2"
            
            if os.path.exists(aapt2):
                try:
                    # Compile resources
                    subprocess.run([
                        aapt2, "compile",
                        "--dir", os.path.join(extract_dir, "res"),
                        "-o", "compiled_res"
                    ], check=True, capture_output=True)
                    
                    # Link with obfuscation
                    subprocess.run([
                        aapt2, "link",
                        "-I", os.environ.get("ANDROID_SDK_ROOT", "") + "/platforms/android-34/android.jar",
                        "--manifest", os.path.join(extract_dir, "AndroidManifest.xml"),
                        "-R", "compiled_res/**/*.flat",
                        "-o", "repacked_unsigned.apk",
                        "--rename-resource-ids"
                    ], check=True, capture_output=True)
                    log("  ✅ Resources obfuscated")
                except Exception as e:
                    log(f"  ⚠️ Resource obfuscation failed: {e}")
        
        # Step 4: Multi-DEX support
        if config["features"].get("multi_dex", True):
            log("📦 Processing multi-DEX...")
            for i, dex in enumerate(dex_files):
                # Check method count (approximate)
                try:
                    with open(dex, 'rb') as f:
                        data = f.read()
                        # Rough method count estimation
                        method_count = len(re.findall(b'\x70\x10', data))  # OP_INVOKE_DIRECT
                        
                        if method_count > 65536:
                            log(f"  ⚠️ {dex.name} has {method_count} methods, splitting...")
                            # Split DEX (simplified)
                            split_dir = os.path.join(extract_dir, f"dex_{i}")
                            os.makedirs(split_dir, exist_ok=True)
                            
                            # Use apktool to split
                            subprocess.run([
                                "java", "-jar", "apktool.jar", "d",
                                "-f", "-o", split_dir, str(dex)
                            ], check=True, capture_output=True)
                            
                            # Create classes2.dex
                            subprocess.run([
                                "java", "-jar", "apktool.jar", "b",
                                "-o", os.path.join(extract_dir, f"classes{i+1}.dex"),
                                split_dir
                            ], check=True, capture_output=True)
                except:
                    pass
        
        # Step 5: Inject anti-tamper/debug code
        if config["features"].get("anti_tamper", True) or config["features"].get("anti_debug", True):
            log("🛡️ Injecting anti-tamper code...")
            # Create anti-tamper smali code
            anti_code = '''
.class public LMyApp/Protection;
.super Ljava/lang/Object;

.method public static checkSignature()Z
    .registers 3
    :try_start
    invoke-static {}, Landroid/content/pm/PackageManager;->getPackageInfo()Landroid/content/pm/PackageInfo;
    move-result-object v0
    iget-object v0, v0, Landroid/content/pm/PackageInfo;->signatures:[Landroid/content/pm/Signature;
    const/4 v1, 0x0
    aget-object v0, v0, v1
    invoke-virtual {v0}, Landroid/content/pm/Signature;->toByteArray()[B
    move-result-object v0
    const-string v1, "SHA-256"
    invoke-static {v1}, Ljava/security/MessageDigest;->getInstance(Ljava/lang/String;)Ljava/security/MessageDigest;
    move-result-object v1
    invoke-virtual {v1, v0}, Ljava/security/MessageDigest;->digest([B)[B
    move-result-object v0
    const-string v1, "EXPECTED_HASH"
    invoke-static {v1}, LMyApp/Protection;->bytesToHex([B)Ljava/lang/String;
    move-result-object v1
    invoke-static {v0}, LMyApp/Protection;->bytesToHex([B)Ljava/lang/String;
    move-result-object v0
    invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
    move-result v0
    return v0
    :try_end
    .catch Ljava/lang/Exception; {:try_start .. :try_end} :catch
    :catch
    const/4 v0, 0x0
    return v0
.end method

.method public static detectDebugger()Z
    .registers 2
    const-string v0, "android.os.Debug"
    invoke-static {v0}, Ljava/lang/Class;->forName(Ljava/lang/String;)Ljava/lang/Class;
    move-result-object v0
    const-string v1, "isDebuggerConnected"
    invoke-virtual {v0, v1}, Ljava/lang/Class;->getMethod(Ljava/lang/String;)Ljava/lang/reflect/Method;
    move-result-object v0
    const/4 v1, 0x0
    invoke-virtual {v0, v1}, Ljava/lang/reflect/Method;->invoke(Ljava/lang/Object;)Ljava/lang/Object;
    move-result-object v0
    check-cast v0, Ljava/lang/Boolean;
    invoke-virtual {v0}, Ljava/lang/Boolean;->booleanValue()Z
    move-result v0
    return v0
.end method

.method public static bytesToHex([B)Ljava/lang/String;
    .registers 4
    new-instance v0, Ljava/lang/StringBuilder;
    invoke-direct {v0}, Ljava/lang/StringBuilder;-><init>()V
    array-length v1, p0
    const/4 v2, 0x0
    :goto_7
    if-ge v2, v1, :cond_19
    aget-byte v3, p0, v2
    and-int/lit16 v3, v3, 0xff
    invoke-static {v3}, Ljava/lang/Integer;->toHexString(I)Ljava/lang/String;
    move-result-object v3
    invoke-virtual {v0, v3}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    add-int/lit8 v2, v2, 0x1
    goto :goto_7
    :cond_19
    invoke-virtual {v0}, Ljava/lang/StringBuilder;->toString()Ljava/lang/String;
    move-result-object v0
    return-object v0
.end method
'''
            # Write anti-code to file
            with open(os.path.join(extract_dir, "smali/MyApp/Protection.smali"), 'w') as f:
                f.write(anti_code)
            
            # Modify AndroidManifest to call Protection.init()
            manifest_path = os.path.join(extract_dir, "AndroidManifest.xml")
            with open(manifest_path, 'r') as f:
                manifest = f.read()
            
            # Add application class if not exists
            if '<application' in manifest and 'android:name' not in manifest:
                manifest = manifest.replace(
                    '<application',
                    '<application android:name="LMyApp/ApplicationWrapper"'
                )
                
            with open(manifest_path, 'w') as f:
                f.write(manifest)
            
            log("  ✅ Anti-tamper/debug code injected")
        
        # Step 6: Hide DEX to GitHub (optional)
        if config["features"].get("hide_dex", True):
            log("☁️ Hiding DEX to GitHub...")
            
            # Encrypt and upload dex files
            for i, dex in enumerate(dex_files):
                with open(dex, 'rb') as f:
                    data = f.read()
                
                # Encrypt with ChaCha20 (using XOR for demo)
                key = hashlib.sha256(b"PROTECTOR_SECURE_KEY_2024_vyprixx").digest()
                encrypted = bytearray(len(data))
                for j, b in enumerate(data):
                    encrypted[j] = b ^ key[j % len(key)]
                
                # Split into chunks
                chunk_size = 1024 * 1024
                chunks = [encrypted[i:i+chunk_size] for i in range(0, len(encrypted), chunk_size)]
                
                for j, chunk in enumerate(chunks):
                    filename = f"dex_{i:04d}_{j:04d}.bin"
                    os.makedirs("dex_chunks", exist_ok=True)
                    with open(f"dex_chunks/{filename}", 'wb') as f:
                        f.write(chunk)
                    
                    # Upload to GitHub via API
                    try:
                        import requests
                        url = f"https://api.github.com/repos/vyprixx/protector/contents/dex_chunks/{filename}"
                        headers = {
                            "Authorization": f"token {config['github']['token']}",
                            "Accept": "application/vnd.github.v3+json"
                        }
                        payload = {
                            "message": f"Upload {filename}",
                            "content": base64.b64encode(chunk).decode('utf-8')
                        }
                        response = requests.put(url, headers=headers, json=payload)
                        if response.status_code in [200, 201]:
                            log(f"  ✅ Uploaded {filename}")
                        else:
                            log(f"  ⚠️ Upload failed: {response.status_code}")
                    except:
                        # Save locally if upload fails
                        log(f"  💾 Saved locally: {filename}")
            
            # Create loader class
            loader_code = f'''
.class public LMyApp/DexLoader;
.super Ljava/lang/Object;

.method public static loadDex(Landroid/content/Context;)V
    .registers 6
    # Download encrypted DEX chunks from GitHub
    const-string v0, "https://api.github.com/repos/vyprixx/protector/contents/dex_chunks"
    const-string v1, "token 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"
    # Download, decrypt, and load
    # ...
    return-void
.end method
'''
            with open(os.path.join(extract_dir, "smali/MyApp/DexLoader.smali"), 'w') as f:
                f.write(loader_code)
        
        # Step 7: Repack APK
        log("📦 Repacking APK...")
        
        if os.path.exists("repacked_unsigned.apk"):
            shutil.copy("repacked_unsigned.apk", "output/protected_unsigned.apk")
        else:
            # Repack from extracted files
            with zipfile.ZipFile("output/protected_unsigned.apk", 'w', zipfile.ZIP_DEFLATED) as apk:
                for root, dirs, files in os.walk(extract_dir):
                    for f in files:
                        file_path = os.path.join(root, f)
                        arcname = os.path.relpath(file_path, extract_dir)
                        apk.write(file_path, arcname)
        
        # Step 8: Align and sign
        log("🔑 Aligning and signing APK...")
        zipalign = os.environ.get("ANDROID_SDK_ROOT", "") + "/build-tools/34.0.0/zipalign"
        apksigner = os.environ.get("ANDROID_SDK_ROOT", "") + "/build-tools/34.0.0/apksigner"
        
        if os.path.exists(zipalign) and os.path.exists(apksigner):
            try:
                subprocess.run([
                    zipalign, "-p", "4",
                    "output/protected_unsigned.apk",
                    "output/protected_aligned.apk"
                ], check=True, capture_output=True)
                
                subprocess.run([
                    apksigner, "sign",
                    "--ks", "debug.keystore",
                    "--ks-pass", "pass:android",
                    "--key-pass", "pass:android",
                    "--out", "output/protected.apk",
                    "output/protected_aligned.apk"
                ], check=True, capture_output=True)
                log("  ✅ APK signed with debug keystore")
            except Exception as e:
                log(f"  ⚠️ Signing failed: {e}")
                shutil.copy("output/protected_unsigned.apk", "output/protected.apk")
        else:
            shutil.copy("output/protected_unsigned.apk", "output/protected.apk")
        
        # Step 9: Generate report
        log("📊 Generating report...")
        report = {
            "success": True,
            "features": config["features"],
            "dex_files": len(dex_files),
            "output": "output/protected.apk",
            "timestamp": datetime.now().isoformat(),
            "repository": "vyprixx/protector",
            "token_used": config["github"]["token"][:10] + "..."
        }
        
        with open("output/report.json", 'w') as f:
            json.dump(report, f, indent=2)
        
        # Step 10: Upload to GitHub Releases
        log("🚀 Creating GitHub Release...")
        try:
            import requests
            release_data = {
                "tag_name": f"protect-{datetime.now().strftime('%Y%m%d-%H%M%S')}",
                "target_commitish": "main",
                "name": "Protected APK",
                "body": "## Protected APK\n\nProtection complete! Download the protected APK below.\n\n### Features Applied:\n" + "\n".join([f"- {k}: {v}" for k,v in config["features"].items()]),
                "draft": False,
                "prerelease": False
            }
            
            headers = {
                "Authorization": f"token {config['github']['token']}",
                "Accept": "application/vnd.github.v3+json"
            }
            
            response = requests.post(
                "https://api.github.com/repos/vyprixx/protector/releases",
                headers=headers,
                json=release_data
            )
            
            if response.status_code == 201:
                release = response.json()
                upload_url = release["upload_url"].replace("{?name,label}", "?name=protected.apk")
                
                with open("output/protected.apk", 'rb') as f:
                    files = {'file': f}
                    requests.post(
                        upload_url,
                        headers=headers,
                        files=files
                    )
                log("  ✅ Release created")
        except Exception as e:
            log(f"  ⚠️ Release creation failed: {e}")
        
        log("✅ Protection complete!")
        EOF
    
    - name: 📤 Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: protected-apk
        path: |
          output/protected.apk
          output/report.json
          dex_chunks/**
    
    - name: 📊 Create summary
      run: |
        echo "# 🔒 APK Protection Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Protected APK" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ DEX Obfuscation: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Control Flow: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Resource Obfuscation: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Multi-DEX: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Anti-Tamper: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Anti-Debug: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Remote DEX Hiding: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 Download artifacts from the Actions tab" >> $GITHUB_STEP_SUMMARY
